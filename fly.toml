# Fly.io deployment for the mTonga sentiment dapp.
# Builds the Dockerfile (Vite build -> nginx) and serves it over HTTPS.
app = "agnt-proj-mtonga-sentiment"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "30s"
  timeout = "3s"
  grace_period = "5s"
  method = "get"
  path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
