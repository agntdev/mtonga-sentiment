<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vote bullish or bearish on TON sentiment by sending a small TON transaction." />
    <title>mTonga sentiment</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="topbar" aria-label="Wallet connection">
      <div id="tonconnect-button" class="tonconnect-slot"></div>
    </header>
    <main class="app-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">TON sentiment tracker</p>
        <h1 id="page-title">Are you bullish or bearish on TON?</h1>
        <p class="hero-copy">
          Cast an on-chain vote with a single tap. Connect your wallet, pick a
          side, and we'll tally the result from real TON transactions — no
          backend, no accounts.
        </p>
      </section>

      <section class="vote-card" aria-label="Sentiment vote options">
        <button
          class="vote-button vote-button--yes"
          data-vote="yes"
          type="button"
          aria-label="Vote bullish — Pavel Durov"
        >
          <span class="vote-emoji" aria-hidden="true">🧑‍💻</span>
          <span class="vote-label">Yes</span>
          <small>Bullish · Durov</small>
        </button>
        <button
          class="vote-button vote-button--no"
          data-vote="no"
          type="button"
          aria-label="Vote bearish — bear"
        >
          <span class="vote-emoji" aria-hidden="true">🐻</span>
          <span class="vote-label">No</span>
          <small>Bearish · Bear</small>
        </button>
      </section>

      <section class="cast-row">
        <button id="cast-vote" class="cast-vote-button" type="button" disabled>
          Cast vote on-chain
        </button>
        <p id="vote-feedback" class="vote-feedback" role="status" aria-live="polite"></p>
      </section>

      <section class="status-panel" aria-live="polite">
        <h2>Current selection</h2>
        <p id="vote-status">Choose a sentiment to prepare a vote.</p>
        <p id="wallet-status" class="wallet-status">Wallet: not connected.</p>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
