server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version in responses.
    server_tokens off;

    # --- Security headers --------------------------------------------------
    # Applied to every response. The CSP is deliberately scoped to keep
    # TonConnect working: scripts are first-party only (the SDK is bundled),
    # while wallet bridges/icons need outbound https/wss, data/blob URIs and
    # injected styles.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https:; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # --- Caching -----------------------------------------------------------
    # Vite emits content-hashed asset filenames, so they're safe to cache
    # immutably. HTML and the wallet manifest must always be revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /tonconnect-manifest.json {
        add_header Cache-Control "no-cache";
        default_type application/json;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # --- SPA routing -------------------------------------------------------
    # Single page: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
